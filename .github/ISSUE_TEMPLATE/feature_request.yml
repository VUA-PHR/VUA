name: Feature request
description: Describe the goal, current obstacle, and available workaround.
body:
  - type: textarea
    id: goal
    attributes:
      label: Your goal
    validations:
      required: true
  - type: textarea
    id: obstacle
    attributes:
      label: Current obstacle
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: Current workaround
  - type: textarea
    id: outcome
    attributes:
      label: Desired result
      description: No technical proposal required.
    validations:
      required: true
