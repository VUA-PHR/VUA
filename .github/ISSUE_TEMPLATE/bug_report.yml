name: Bug report
description: Report a reproducible problem; use private reporting for security vulnerabilities.
body:
  - type: markdown
    attributes:
      value: "Do not upload paid assets, complete projects, cookies, tokens, or raw private logs. Report vulnerabilities privately through the Security page."
  - type: input
    id: version
    attributes:
      label: VUA version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Windows version; include the editor and relevant package versions if Unity is involved.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected_actual
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: dropdown
    id: data_kind
    attributes:
      label: Reproduction data
      options:
        - Real local data (not attached)
        - Synthetic or demo data
        - Not applicable or unsure
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Optional; include only relevant excerpts and remove personal paths, accounts, credentials, and product content.
