[package]
name = "vua-project-manager"
version = "0.1.0"
edition = "2021"
publish = false
description = "Project and environment adapters: concrete VPM backends, project mutation lock, environment-manager detection."
license = "Apache-2.0"

[lib]
path = "src/lib.rs"

[dependencies]
reqwest = { version = "0.13.4", default-features = false, features = ["stream", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", default-features = false, features = ["rt-multi-thread", "fs"] }
vrc-get-vpm = { version = "=0.0.16", features = ["rustls", "vrc-get-litedb", "experimental-project-management"] }
vua-orchestrator = { path = "../orchestrator" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage",
    "Win32_System_IO",
    "Win32_Security_Cryptography",
    "Win32_Security_WinTrust",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
] }

[features]
# Gates the two real-machine test hooks (terminate_open_and_wait_for_test,
# eac_verify_windows_signature_for_test) out of the default public surface:
# they are termination/verification primitives and must not be importable by
# a plain build. Integration tests that consume them compile only with
# `--features test-hooks`.
test-hooks = []

[dev-dependencies]
jsonschema = "0.52.1"
