[package]
name = "vua-orchestrator"
version = "0.1.0"
edition = "2021"
publish = false
description = "Local-first VUA orchestration core for Recipe-first AMF workflows."

[lib]
path = "src/lib.rs"

[dependencies]
reqwest = { version = "0.13.4", default-features = false, features = ["stream", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
tokio = { version = "1.53.1", default-features = false, features = ["rt-multi-thread", "fs"] }
vrc-get-vpm = { version = "=0.0.16", features = ["rustls"] }

[dev-dependencies]
jsonschema = "0.52.1"
