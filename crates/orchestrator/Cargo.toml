[package]
name = "vua-orchestrator"
version = "0.1.0"
edition = "2021"
publish = false
description = "Local-first VUA orchestration core for Recipe-first AMF workflows."
license = "Apache-2.0"

[lib]
path = "src/lib.rs"

[dependencies]
rusqlite = { version = "=0.40.1", features = ["bundled"] }
scraper = "0.27.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
vua-bdl-store = { path = "../bdl-store" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_Storage",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }

[dev-dependencies]
jsonschema = "0.52.1"
